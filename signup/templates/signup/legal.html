{% extends "base.html" %}
{% load static %}
{% block title %}{{ legal_title }} | Hexagon{% endblock %}
{% block styles %}<link rel="stylesheet" href="{% static 'signup/css/signup.css' %}">{% endblock %}
{% block content %}
<main class="legal-page">
  <a class="brand legal-page__brand" href="{% url 'signup:signup' %}" aria-label="Hexagon home">
    <img class="brand__mark" src="{% static 'signup/images/logo.png' %}" alt="">
    <span><strong>Hexagon</strong><small>HEXAGON</small></span>
  </a>
  <section class="legal-card">
    <p class="form-kicker">LEGAL INFORMATION</p>
    <h1>{{ legal_title }}</h1>
    <p>{{ legal_message }}</p>
    <a class="legal-back" href="{% url 'signup:signup' %}">Return to Hexagon</a>
  </section>
</main>
{% endblock %}
