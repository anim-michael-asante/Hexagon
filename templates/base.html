{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Hexagon — every seat, the same screen, in sync.">
  <link rel="icon" href="{% static 'signup/images/favicon.ico' %}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'signup/images/favicon-32x32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'signup/images/favicon-16x16.png' %}">
  <link rel="apple-touch-icon" href="{% static 'signup/images/logo.png' %}">
  <title>{% block title %}Hexagon{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  {% block styles %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  <footer class="site-footer">
    <a href="{% url 'signup:legal' page='terms' %}">Terms</a>
    <a href="{% url 'signup:legal' page='privacy' %}">Privacy</a>
    <a href="{% url 'signup:legal' page='cookies' %}">Cookies</a>
    <a href="{% url 'signup:legal' page='acceptable-use' %}">Acceptable use</a>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
