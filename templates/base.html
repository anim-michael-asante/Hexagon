{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Artificial Synaptic Panels — every seat, the same screen, in sync.">
  <title>{% block title %}ASP Technology{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  {% block styles %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
  <footer class="site-footer">
    <a href="{% url 'signup:legal' page='terms' %}">Terms</a>
    <a href="{% url 'signup:legal' page='privacy' %}">Privacy</a>
    <a href="{% url 'signup:legal' page='cookies' %}">Cookies</a>
    <a href="{% url 'signup:legal' page='acceptable-use' %}">Acceptable use</a>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
